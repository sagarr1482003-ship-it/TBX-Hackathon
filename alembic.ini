# Alembic configuration (Task 1.4). UNVERIFIED — migrations require a running PostgreSQL.
[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is overridden at runtime in env.py from Settings.postgres_dsn (sync driver).
sqlalchemy.url = postgresql+psycopg://tbx_app:tbx_app@localhost:5432/tbx

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
