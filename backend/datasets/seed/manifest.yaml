# Seed dataset manifest (Requirement 5.1, 8.1) — organiser bank/account/transaction schema.
# Source column names are identity-mapped to canonical names; monetary columns carry the ₹
# symbol, "," thousands separator and parentheses for negatives, exercising the
# Local_File_Connector's Requirement 6.4 parsing. Target database is PostgreSQL.
dataset_id: tbx_seed
version: "1"
source_mode: local_files
encoding: utf-8
currency: INR
currency_symbols: ["\u20b9", "Rs.", "INR"]
thousands_separator: ","
coverage:
  first_date: 2024-07-01
  last_date: 2026-06-30
reference_date_policy: latest_transaction_date

data_dictionary:
  kind: csv
  path: datasets/seed/data_dictionary.csv
  entity_column: entity
  column_column: column
  description_column: description

entities:
  - name: bank
    source: { kind: local_file, path: datasets/seed/bank.csv, file_format: csv }
    primary_key: [bank_code]
    identifier_field: bank_code
    columns:
      - { source_name: bank_code, canonical_name: bank_code, type: text, required: true, is_join_key: true }
      - { source_name: bank_name, canonical_name: bank_name, type: text, required: true, is_filter_column: true }

  - name: account
    source: { kind: local_file, path: datasets/seed/account.csv, file_format: csv }
    primary_key: [account_id]
    identifier_field: account_id
    columns:
      - { source_name: account_id, canonical_name: account_id, type: text, required: true, is_join_key: true }
      - { source_name: entity_id, canonical_name: entity_id, type: text, required: true, is_filter_column: true }
      - { source_name: account_number, canonical_name: account_number, type: text, required: true }
      - { source_name: program_id, canonical_name: program_id, type: integer, required: true, is_filter_column: true }
      - { source_name: available_balance, canonical_name: available_balance, type: numeric, required: true, numeric_scale: 2, unit: INR }
      - { source_name: bank_code, canonical_name: bank_code, type: text, required: true, is_filter_column: true, is_join_key: true }
    joins:
      - { target_entity: bank, local_columns: [bank_code], target_columns: [bank_code] }

  - name: transaction
    source: { kind: local_file, path: datasets/seed/transaction.csv, file_format: csv }
    primary_key: [transaction_id]
    identifier_field: transaction_id
    columns:
      - { source_name: transaction_id, canonical_name: transaction_id, type: text, required: true }
      - { source_name: account_id, canonical_name: account_id, type: text, required: true, is_filter_column: true, is_join_key: true }
      - { source_name: transaction_date, canonical_name: transaction_date, type: timestamp, required: true, date_format: "%Y-%m-%d %H:%M:%S.%f", is_filter_column: true }
      - { source_name: transaction_type, canonical_name: transaction_type, type: text, required: true, is_filter_column: true }
      - { source_name: description, canonical_name: description, type: text }
      - { source_name: transaction_amount, canonical_name: transaction_amount, type: numeric, required: true, numeric_scale: 2, unit: INR }
      - { source_name: transaction_reference_id, canonical_name: transaction_reference_id, type: text, is_filter_column: true }
      - { source_name: utr_number, canonical_name: utr_number, type: text }
    joins:
      - { target_entity: account, local_columns: [account_id], target_columns: [account_id] }

metrics: []
